name: 🚀 Continuous Integration (Build & Lint)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: 🔨 Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 📥 Install Dependencies
        working-directory: ui
        run: npm ci

      - name: 🔎 Type-check TypeScript
        working-directory: ui
        run: npx tsc --noEmit

      - name: 🧹 Run ESLint
        working-directory: ui
        run: npm run lint

      - name: 🏗️ Verify Production Build
        working-directory: ui
        run: npm run build
