# Neural City Dashboard — GitHub Actions CI/CD
# ───────────────────────────────────────────────
# Author: Soumoditya Das
#
# This workflow:
#   1. Trains the ONNX ML model (Python, scikit-learn)
#   2. Runs TypeScript type-check and ESLint
#   3. Builds the Next.js production bundle
#   4. Deploys to Vercel via the Vercel CLI
#
# Trigger: every push to main or pull_request targeting main.
# Zero secrets needed for Open-Meteo (the free AQI API).
# Only VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID are needed for deploy.

name: 🚀 Neural City — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Train ML Model ─────────────────────────────────────────────
  train-model:
    name: 🧠 Train ONNX AQI Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python ML dependencies
        run: |
          pip install pandas scikit-learn skl2onnx numpy onnx

      - name: Train and export ONNX model
        working-directory: ml_model
        run: python train_aqi_model.py

      - name: Upload ONNX model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: ui/public/models/aqi_forecast_model.onnx
          retention-days: 7

  # ── Job 2: Lint, Type-check, Build ───────────────────────────────────
  build:
    name: 🔨 Lint & Build Next.js
    runs-on: ubuntu-latest
    needs: train-model  # Wait for ONNX model to be ready

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Download ONNX model
        uses: actions/download-artifact@v4
        with:
          name: onnx-model
          path: ui/public/models/

      - name: Install Node dependencies
        working-directory: ui
        run: npm ci

      - name: Type-check TypeScript
        working-directory: ui
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: ui
        run: npm run lint

      - name: Build production bundle
        working-directory: ui
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: ui/.next/
          retention-days: 1

  # ── Job 3: Deploy to Vercel ───────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download ONNX model
        uses: actions/download-artifact@v4
        with:
          name: onnx-model
          path: ui/public/models/

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel Production
        working-directory: ui
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
